[package]
name = "lct-rust"
version = "0.1.0"
edition = "2021"
default-run = "lct-rust"

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
pprof = { version = "0.13", features = ["criterion", "flamegraph"] }

[features]
default = []
cplex = []
gurobi = []
